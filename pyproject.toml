[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentic-engineering"
version = "0.1.0"
description = "A provider-neutral, evidence-driven framework for reliable AI-assisted software engineering."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "langgraph>=0.2,<1.0",
    "pydantic>=2.7,<3.0",
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
]

[project.scripts]
agentic = "agentic_engineering.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_engineering"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/spec.schema.json" = "agentic_engineering/schemas/spec.schema.json"
"schemas/evidence.schema.json" = "agentic_engineering/schemas/evidence.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
