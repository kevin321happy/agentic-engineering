<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 474" width="820" height="474" role="img" aria-labelledby="title" xml:lang="en"><title id="title">System architecture</title>
<rect width="820" height="474" rx="12" fill="#fff"/>
<g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif">
<text x="28" y="42" font-size="27" font-weight="700" fill="#000">System architecture</text>
<text x="28" y="75" font-size="16" font-weight="400" fill="#000">Target design  /  responsibility by layer</text>
<path d="M28 152H792" stroke="#000" stroke-opacity=".18"/>
<text x="44" y="127" font-size="17" font-weight="650" fill="#000">Design</text>
<text x="182" y="117" font-size="18" font-weight="650" fill="#000">Engineer + coding assistant</text>
<text x="182" y="140" font-size="15" font-weight="400" fill="#000">Define behavior and scope; propose a patch.</text>
<path d="M28 216H792" stroke="#000" stroke-opacity=".18"/>
<text x="44" y="191" font-size="17" font-weight="650" fill="#000">Orchestrate</text>
<text x="182" y="181" font-size="18" font-weight="650" fill="#000">Feature and bugfix workflows</text>
<text x="182" y="204" font-size="15" font-weight="400" fill="#000">Coordinate steps, suspend, resume and replay.</text>
<path d="M28 280H792" stroke="#000" stroke-opacity=".18"/>
<text x="44" y="255" font-size="17" font-weight="650" fill="#000">Authorize</text>
<text x="182" y="245" font-size="18" font-weight="650" fill="#000">Policy and human approval</text>
<text x="182" y="268" font-size="15" font-weight="400" fill="#000">Bind evidence and permission to a specific change.</text>
<path d="M28 344H792" stroke="#000" stroke-opacity=".18"/>
<text x="44" y="319" font-size="17" font-weight="650" fill="#000">Execute</text>
<text x="182" y="309" font-size="18" font-weight="650" fill="#000">Workspace, Git and test adapters</text>
<text x="182" y="332" font-size="15" font-weight="400" fill="#000">Run authorized operations; return diffs and test results.</text>
<rect x="28" y="358" width="764" height="67" rx="6" fill="#fff" stroke="#000"/>
<text x="44" y="384" font-size="19" font-weight="700" fill="#000">Implemented foundation</text>
<text x="44" y="410" font-size="17" font-weight="400" fill="#000">Typed protocols + schemas     /     SQLite gate ledger + checkpoint recovery</text>
<text x="30" y="453" font-size="15" font-weight="400" fill="#000">Optional project knowledge informs the agent; it never grants permission.</text>
</g></svg>
