<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 474" width="820" height="474" role="img" aria-labelledby="title" xml:lang="zh-CN"><title id="title">系统架构</title>
<rect width="820" height="474" rx="12" fill="#fff"/>
<g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif">
<text x="28" y="42" font-size="27" font-weight="700" fill="#000">系统架构</text>
<text x="28" y="75" font-size="16" font-weight="400" fill="#000">目标设计  /  按职责分层</text>
<path d="M28 152H792" stroke="#000" stroke-opacity=".18"/>
<text x="44" y="127" font-size="17" font-weight="650" fill="#000">定义</text>
<text x="182" y="117" font-size="18" font-weight="650" fill="#000">研发与编码助手</text>
<text x="182" y="140" font-size="15" font-weight="400" fill="#000">研发定义行为和范围；智能体提出补丁。</text>
<path d="M28 216H792" stroke="#000" stroke-opacity=".18"/>
<text x="44" y="191" font-size="17" font-weight="650" fill="#000">编排</text>
<text x="182" y="181" font-size="18" font-weight="650" fill="#000">需求与缺陷工作流</text>
<text x="182" y="204" font-size="15" font-weight="400" fill="#000">运行时推进阶段、挂起、恢复与回放。</text>
<path d="M28 280H792" stroke="#000" stroke-opacity=".18"/>
<text x="44" y="255" font-size="17" font-weight="650" fill="#000">授权</text>
<text x="182" y="245" font-size="18" font-weight="650" fill="#000">策略与人工审批</text>
<text x="182" y="268" font-size="15" font-weight="400" fill="#000">针对特定变更核验证据与操作权限。</text>
<path d="M28 344H792" stroke="#000" stroke-opacity=".18"/>
<text x="44" y="319" font-size="17" font-weight="650" fill="#000">执行</text>
<text x="182" y="309" font-size="18" font-weight="650" fill="#000">工作区、Git 与测试适配器</text>
<text x="182" y="332" font-size="15" font-weight="400" fill="#000">仅执行获准操作，返回实际 Diff 和测试结果。</text>
<rect x="28" y="358" width="764" height="67" rx="6" fill="#fff" stroke="#000"/>
<text x="44" y="384" font-size="19" font-weight="700" fill="#000">已实现的基础能力</text>
<text x="44" y="410" font-size="17" font-weight="400" fill="#000">类型协议与 Schema     /     SQLite 门禁账本与检查点恢复</text>
<text x="30" y="453" font-size="15" font-weight="400" fill="#000">可选项目知识仅供智能体参考，不授予执行权限。</text>
</g></svg>
