<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 474" width="820" height="474" role="img" aria-labelledby="title" xml:lang="zh-CN"><title id="title">系统架构</title>
<rect width="820" height="474" rx="12" fill="#f5f8fb"/>
<g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif">
<text x="28" y="42" font-size="27" font-weight="700" fill="#173752">系统架构</text>
<text x="28" y="75" font-size="16" font-weight="400" fill="#35577a">目标设计  /  按职责分层</text>
<rect x="28" y="94" width="764" height="58" rx="6" fill="#e6edf3"/>
<text x="44" y="127" font-size="17" font-weight="650" fill="#35577a">定义</text>
<text x="182" y="117" font-size="18" font-weight="650" fill="#173752">研发与编码助手</text>
<text x="182" y="140" font-size="15" font-weight="400" fill="#173752">研发定义行为和范围；智能体提出补丁。</text>
<rect x="28" y="158" width="764" height="58" rx="6" fill="#eef2f6"/>
<text x="44" y="191" font-size="17" font-weight="650" fill="#35577a">编排</text>
<text x="182" y="181" font-size="18" font-weight="650" fill="#173752">需求与缺陷工作流</text>
<text x="182" y="204" font-size="15" font-weight="400" fill="#173752">运行时推进阶段、挂起、恢复与回放。</text>
<rect x="28" y="222" width="764" height="58" rx="6" fill="#e6edf3"/>
<text x="44" y="255" font-size="17" font-weight="650" fill="#35577a">授权</text>
<text x="182" y="245" font-size="18" font-weight="650" fill="#173752">策略与人工审批</text>
<text x="182" y="268" font-size="15" font-weight="400" fill="#173752">针对特定变更核验证据与操作权限。</text>
<rect x="28" y="286" width="764" height="58" rx="6" fill="#eef2f6"/>
<text x="44" y="319" font-size="17" font-weight="650" fill="#35577a">执行</text>
<text x="182" y="309" font-size="18" font-weight="650" fill="#173752">工作区、Git 与测试适配器</text>
<text x="182" y="332" font-size="15" font-weight="400" fill="#173752">仅执行获准操作，返回实际 Diff 和测试结果。</text>
<rect x="28" y="358" width="764" height="67" rx="6" fill="#d7eee8"/>
<text x="44" y="384" font-size="19" font-weight="700" fill="#096a60">已实现的基础能力</text>
<text x="44" y="410" font-size="17" font-weight="400" fill="#096a60">类型协议与 Schema     /     SQLite 门禁账本与检查点恢复</text>
<text x="30" y="453" font-size="15" font-weight="400" fill="#35577a">可选项目知识仅供智能体参考，不授予执行权限。</text>
</g></svg>
