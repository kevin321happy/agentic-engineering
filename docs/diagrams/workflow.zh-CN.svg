<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 492" width="820" height="492" role="img" aria-labelledby="title" xml:lang="zh-CN"><title id="title">从任务到评审</title>
<rect width="820" height="492" rx="12" fill="#f5f8fb"/>
<g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif">
<text x="28" y="42" font-size="27" font-weight="700" fill="#173752">从任务到评审</text>
<text x="28" y="74" font-size="16" font-weight="400" fill="#35577a">规划中的工作流  /  两类入口，共用验收路径</text>
<rect x="28" y="96" width="370" height="66" rx="6" fill="#e6edf3"/>
<text x="44" y="123" font-size="20" font-weight="650" fill="#173752">需求开发</text>
<text x="44" y="148" font-size="16" font-weight="400" fill="#173752">确认范围与验收用例。</text>
<rect x="422" y="96" width="370" height="66" rx="6" fill="#e6edf3"/>
<text x="438" y="123" font-size="20" font-weight="650" fill="#173752">缺陷修复</text>
<text x="438" y="148" font-size="16" font-weight="400" fill="#173752">复现故障，确认根因和回归范围。</text>
<path d="M213 162 V177 H607 V162 M410 177 V194" fill="none" stroke="#7891a5" stroke-width="2"/>
<rect x="135" y="194" width="550" height="52" rx="6" fill="#dce7f0"/>
<text x="157" y="227" font-size="20" font-weight="650" fill="#173752">在受限工作区生成补丁</text>
<path d="M410 246 V264" fill="none" stroke="#7891a5" stroke-width="2"/>
<rect x="135" y="264" width="550" height="69" rx="6" fill="#173752"/>
<text x="157" y="292" font-size="20" font-weight="650" fill="white">先检查修改范围，再验证行为</text>
<text x="157" y="318" font-size="16" font-weight="400" fill="#d8e6ee">实际 Diff  →  验收用例  →  回归结果</text>
<path d="M410 333 V351 M213 366 V351 H607 V366" fill="none" stroke="#7891a5" stroke-width="2"/>
<rect x="28" y="366" width="370" height="99" rx="6" fill="#faead8"/>
<text x="44" y="395" font-size="21" font-weight="700" fill="#874a13">暂停</text>
<text x="44" y="425" font-size="16" font-weight="400" fill="#173752">超出范围：缩小补丁或重新审批。</text>
<text x="44" y="450" font-size="16" font-weight="400" fill="#173752">缺少证据：补证并重新验证。</text>
<rect x="422" y="366" width="370" height="99" rx="6" fill="#d7eee8"/>
<text x="438" y="395" font-size="21" font-weight="700" fill="#096a60">提交评审</text>
<text x="438" y="425" font-size="16" font-weight="400" fill="#173752">交付补丁、证据与剩余风险。</text>
<text x="438" y="450" font-size="16" font-weight="400" fill="#173752">合并仍须独立授权。</text>
</g></svg>
